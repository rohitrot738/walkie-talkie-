name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=walkie" >> "$GITHUB_ENV"
      - name: Generate platform folders and patch manifest
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.walkie --project-name walkie_talkie .
          python3 patch_android.py
      - name: Build APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release \
            --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=SERVER_URL=${{ vars.SERVER_URL || 'http://10.0.2.2:3000' }}
      - name: Write version.json
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk walkie-talkie.apk
          python3 - <<'PY'
          import hashlib, json, subprocess
          apk = open('walkie-talkie.apk', 'rb').read()
          json.dump({
              'build': ${{ github.run_number }},
              'sha256': hashlib.sha256(apk).hexdigest(),
              'notes': subprocess.check_output(['git', 'log', '-1', '--pretty=%s']).decode().strip(),
          }, open('version.json', 'w'))
          PY
          cat version.json
      - name: Publish release
        if: env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest walkie-talkie.apk version.json \
            --title "Walkie Talkie build ${{ github.run_number }}" --notes "Auto-built. App khud update check karti hai." \
            --target "${{ github.sha }}"
      - name: Signing key missing
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets set nahi hain, isliye release publish nahi hui."

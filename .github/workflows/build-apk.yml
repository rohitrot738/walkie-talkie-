name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders and patch manifest
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.walkie --project-name walkie_talkie .
          python3 patch_android.py
      - name: Build APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --dart-define=SERVER_URL=${{ vars.SERVER_URL || 'http://10.0.2.2:3000' }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk walkie-talkie.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest walkie-talkie.apk --title "Walkie Talkie APK" --notes "Latest build" --target "${{ github.sha }}"

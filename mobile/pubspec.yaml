name: walkie_talkie
description: Frequency based push-to-talk walkie talkie
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.2.0
  socket_io_client: ^2.0.3+1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  ota_update: ^7.1.0
  flutter_foreground_task: ^11.0.3

flutter:
  uses-material-design: true
